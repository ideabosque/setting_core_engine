[project]
name = "setting-core-engine"
version = "0.0.1"
description = "Setting Core Engine"
authors = [{name = "Idea Bosque"}]
dependencies = [
  "graphene",
  "pendulum",
  "tenacity",
  "SilvaEngine-DynamoDB-Base",
  "SilvaEngine-Utility",
  "silvaengine-definitions",
]

[project.optional-dependencies]
postgresql = [
  "SQLAlchemy>=1.4",
  "psycopg2-binary>=2.9",
]

[tool.pyright]
typeCheckingMode = "basic"
reportCallIssue = "none"
reportArgumentType = "none"
reportOptionalMemberAccess = "none"
reportAttributeAccessIssue = "none"
